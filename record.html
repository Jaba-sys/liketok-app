<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeTok — Новое видео</title>
<style>
  :root{
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --dark:#161823;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    min-height:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--dark);
    color:#fff;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid #2a2c3a;
  }
  header button{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }
  header .title{ font-weight:700; font-size:16px; }

  .wrap{
    max-width:420px;
    margin:0 auto;
    padding:20px 16px 40px;
    text-align:center;
  }
  .limit-text{ font-size:12px; color:#999; margin:6px 0 14px; }

  .stage{
    position:relative;
    width:100%;
    max-height:60vh;
    border-radius:14px;
    background:#000;
    overflow:hidden;
  }
  video#recPreview{ display:none; }
  #recCanvas, video#preview, video#takePreview{
    width:100%;
    max-height:60vh;
    display:block;
    background:#000;
  }
  #recCanvas{ display:none; }
  video#preview, video#takePreview{ display:none; }

  .rec-badge{
    position:absolute;
    top:10px; left:10px;
    background:rgba(0,0,0,.5);
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:6px;
  }
  .rec-badge.show{ display:flex; }
  .rec-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--pink);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{ 50%{ opacity:.3; } }

  .flip-btn{
    position:absolute;
    top:10px; right:10px;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(0,0,0,.5);
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
  }
  .flip-btn:disabled{ opacity:.3; cursor:not-allowed; }

  .rec-controls{
    display:flex;
    gap:10px;
    margin-top:16px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.pill{
    border:none;
    border-radius:20px;
    padding:12px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
  }
  .btn-start{ background:var(--pink); }
  .btn-pause{ background:#e8a93a; }
  .btn-finish{ background:#1fa774; }
  .btn-post{ background:linear-gradient(90deg,var(--pink),#ff5c7a); }
  .btn-cancel{ background:#333; }
  .btn-next{ background:linear-gradient(90deg,var(--cyan),var(--pink)); }
  button.pill:disabled{ opacity:.4; cursor:not-allowed; }
  input#caption{
    width:100%;
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #333;
    background:#1f2130;
    color:#fff;
    font-size:14px;
  }
  .rec-timer{
    font-size:14px;
    color:var(--pink);
    font-weight:700;
    margin-top:10px;
  }
  .spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    vertical-align:middle;
    margin-right:6px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .takes-list{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:16px;
    padding-bottom:4px;
  }
  .take-chip{
    flex:0 0 auto;
    background:#1f2130;
    border-radius:10px;
    padding:8px 10px;
    font-size:12px;
    text-align:left;
    min-width:100px;
  }
  .take-chip .label{ font-weight:700; }
  .take-chip .dur{ color:#999; font-size:11px; margin-top:2px; }
  .take-chip .row{ display:flex; gap:6px; margin-top:6px; }
  .take-chip button{
    flex:1;
    border:none;
    border-radius:6px;
    padding:5px 0;
    font-size:11px;
    cursor:pointer;
    color:#fff;
  }
  .take-chip .play-btn{ background:#333; }
  .take-chip .del-btn{ background:#d64545; }
</style>
</head>
<body>

<header>
  <button id="backBtn">←</button>
  <div class="title">Новое видео</div>
</header>

<div class="wrap">
  <div class="limit-text" id="limitText">Загрузка...</div>

  <div class="stage">
    <video id="recPreview" autoplay muted playsinline></video>
    <canvas id="recCanvas" width="480" height="854"></canvas>
    <video id="takePreview" controls playsinline></video>
    <video id="preview" controls playsinline></video>
    <div class="rec-badge" id="recBadge"><span class="rec-dot"></span>REC</div>
    <button class="flip-btn" id="flipBtn" title="Перевернуть камеру" disabled>🔄</button>
  </div>

  <div class="rec-timer" id="recTimer"></div>

  <div class="rec-controls" id="recControls">
    <button class="pill btn-start" id="enableCamBtn">📷 Включить камеру</button>
  </div>

  <div class="takes-list" id="takesList"></div>

  <input type="text" id="caption" placeholder="Подпись к видео..." style="display:none;">
  <div class="rec-controls" id="postControls" style="display:none;">
    <button class="pill btn-post" id="postBtn">Опубликовать</button>
    <button class="pill btn-cancel" id="cancelBtn">Заново</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const username = sessionStorage.getItem("liketok_user");
  if (!username || !sessionStorage.getItem("liketok_token")){
    window.location.href = "index.html";
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const videosRef = db.ref("videos");

  const DAILY_LIMIT = 8;
  const MAX_TOTAL_BYTES = 15 * 1024 * 1024;
  const MAX_RECORD_MS = 15000; // общий лимит на все дубли вместе

  document.getElementById("backBtn").addEventListener("click", () => {
    stopEverythingAndLeave();
  });
  function stopEverythingAndLeave(){
    if (mediaRecorder && mediaRecorder.state !== "inactive"){
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    cancelAnimationFrame(drawLoopId);
    clearInterval(recordInterval);
    stopCameraIfActive();
    window.location.href = "feed.html";
  }
  function stopCameraIfActive(){
    if (mediaStream){
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
  }

  // --- состояние ---
  let mediaStream = null;
  let mediaRecorder = null;
  let drawLoopId = null;
  let currentFacing = "user";
  let takes = []; // {id, blob, poster, durationMs}
  let takeChunks = [];
  let takeElapsedMs = 0;
  let totalUsedMs = 0;
  let recordInterval = null;
  let previewingTakeId = null;
  let finalBlob = null;
  let finalPoster = null;

  const recPreview = document.getElementById("recPreview");
  const recCanvas = document.getElementById("recCanvas");
  const canvasCtx = recCanvas.getContext("2d");
  const takePreview = document.getElementById("takePreview");
  const preview = document.getElementById("preview");
  const recBadge = document.getElementById("recBadge");
  const flipBtn = document.getElementById("flipBtn");
  const recTimer = document.getElementById("recTimer");
  const recControls = document.getElementById("recControls");
  const postControls = document.getElementById("postControls");
  const captionInput = document.getElementById("caption");
  const takesListEl = document.getElementById("takesList");

  function totalTakesMs(){
    return takes.reduce((sum, t) => sum + t.durationMs, 0);
  }

  function drawFrame(){
    const vw = recPreview.videoWidth;
    const vh = recPreview.videoHeight;
    if (vw && vh){
      const canvasRatio = recCanvas.width / recCanvas.height;
      const videoRatio = vw / vh;
      let sx, sy, sw, sh;
      if (videoRatio > canvasRatio){
        sh = vh; sw = vh * canvasRatio; sx = (vw - sw) / 2; sy = 0;
      } else {
        sw = vw; sh = vw / canvasRatio; sx = 0; sy = (vh - sh) / 2;
      }
      canvasCtx.save();
      if (currentFacing === "user"){
        canvasCtx.translate(recCanvas.width, 0);
        canvasCtx.scale(-1, 1); // зеркалим только фронтальную камеру
      }
      canvasCtx.drawImage(recPreview, sx, sy, sw, sh, 0, 0, recCanvas.width, recCanvas.height);
      canvasCtx.restore();
    }
    drawLoopId = requestAnimationFrame(drawFrame);
  }

  async function startCameraStream(facing){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: true
      });
      return stream;
    } catch(e){
      alert("Не удалось получить доступ к камере: " + e.message);
      return null;
    }
  }

  // --- шаг 1: включить камеру (без записи) ---
  document.getElementById("enableCamBtn").addEventListener("click", async () => {
    const stream = await startCameraStream(currentFacing);
    if (!stream) return;
    mediaStream = stream;
    recPreview.srcObject = mediaStream;
    await recPreview.play();
    recCanvas.style.display = "block";
    drawFrame();
    showIdleControls();
  });

  // --- переворот камеры (доступен, пока не идёт запись дубля) ---
  flipBtn.addEventListener("click", async () => {
    if (!mediaStream) return;
    if (mediaRecorder && mediaRecorder.state !== "inactive") return; // не переключаем во время записи
    currentFacing = currentFacing === "user" ? "environment" : "user";
    stopCameraIfActive();
    const stream = await startCameraStream(currentFacing);
    if (!stream){
      currentFacing = currentFacing === "user" ? "environment" : "user"; // откат
      return;
    }
    mediaStream = stream;
    recPreview.srcObject = mediaStream;
    await recPreview.play();
  });

  function showIdleControls(){
    recBadge.classList.remove("show");
    flipBtn.disabled = false;
    const left = MAX_RECORD_MS - totalTakesMs();
    let html = `<button class="pill btn-start" id="recordTakeBtn">⏺ Записать дубль</button>`;
    if (takes.length > 0){
      html += `<button class="pill btn-next" id="nextBtn">✅ Далее</button>`;
    }
    recControls.innerHTML = html;
    document.getElementById("recordTakeBtn").addEventListener("click", startTake);
    document.getElementById("recordTakeBtn").disabled = left <= 500;
    if (takes.length > 0){
      document.getElementById("nextBtn").addEventListener("click", finishAllTakes);
    }
    updateTimerIdleText();
  }

  function updateTimerIdleText(){
    const leftSec = Math.max(0, Math.round((MAX_RECORD_MS - totalTakesMs()) / 1000));
    recTimer.textContent = takes.length > 0
      ? `Осталось: ${leftSec}s (дублей: ${takes.length})`
      : `Осталось: ${leftSec}s`;
  }

  // --- запись одного дубля ---
  function startTake(){
    flipBtn.disabled = true;
    recBadge.classList.add("show");
    takeChunks = [];
    takeElapsedMs = 0;

    const canvasStream = recCanvas.captureStream(30);
    const audioTracks = mediaStream.getAudioTracks();
    const recordStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

    let mimeType = "video/webm;codecs=vp8,opus";
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "video/webm";
    mediaRecorder = new MediaRecorder(recordStream, {
      mimeType,
      videoBitsPerSecond: 700000,
      audioBitsPerSecond: 128000
    });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) takeChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(takeChunks, { type: "video/webm" });
      const poster = recCanvas.toDataURL("image/jpeg", 0.7);
      takes.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        blob, poster,
        durationMs: takeElapsedMs
      });
      renderTakesList();
      showIdleControls();
    };
    mediaRecorder.start(500);

    recControls.innerHTML = `<button class="pill btn-pause" id="pauseBtn">⏸ Пауза</button><button class="pill btn-finish" id="stopTakeBtn">⏹ Стоп</button>`;
    document.getElementById("pauseBtn").addEventListener("click", pauseTake);
    document.getElementById("stopTakeBtn").addEventListener("click", stopTake);

    recordInterval = setInterval(() => {
      if (mediaRecorder && mediaRecorder.state === "recording"){
        takeElapsedMs += 200;
        totalUsedMs = totalTakesMs() + takeElapsedMs;
        const leftSec = Math.max(0, ((MAX_RECORD_MS - totalUsedMs) / 1000)).toFixed(1);
        recTimer.textContent = `Запись... осталось: ${leftSec}s`;
        if (totalUsedMs >= MAX_RECORD_MS) stopTake();
      }
    }, 200);
  }

  function pauseTake(){
    if (mediaRecorder && mediaRecorder.state === "recording"){
      mediaRecorder.pause();
      recControls.innerHTML = `<button class="pill btn-start" id="resumeBtn">▶ Продолжить</button><button class="pill btn-finish" id="stopTakeBtn2">⏹ Стоп</button>`;
      document.getElementById("resumeBtn").addEventListener("click", resumeTake);
      document.getElementById("stopTakeBtn2").addEventListener("click", stopTake);
    }
  }
  function resumeTake(){
    if (mediaRecorder && mediaRecorder.state === "paused"){
      mediaRecorder.resume();
      recControls.innerHTML = `<button class="pill btn-pause" id="pauseBtn2">⏸ Пауза</button><button class="pill btn-finish" id="stopTakeBtn3">⏹ Стоп</button>`;
      document.getElementById("pauseBtn2").addEventListener("click", pauseTake);
      document.getElementById("stopTakeBtn3").addEventListener("click", stopTake);
    }
  }
  function stopTake(){
    clearInterval(recordInterval);
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  // --- список дублей ---
  function renderTakesList(){
    takesListEl.innerHTML = takes.map((t, i) => `
      <div class="take-chip" data-id="${t.id}">
        <div class="label">Дубль ${i+1}</div>
        <div class="dur">${(t.durationMs/1000).toFixed(1)}с</div>
        <div class="row">
          <button class="play-btn" data-action="playTake" data-id="${t.id}">▶</button>
          <button class="del-btn" data-action="delTake" data-id="${t.id}">✕</button>
        </div>
      </div>
    `).join("");

    takesListEl.querySelectorAll("[data-action='playTake']").forEach(btn => {
      btn.addEventListener("click", () => playTake(btn.dataset.id));
    });
    takesListEl.querySelectorAll("[data-action='delTake']").forEach(btn => {
      btn.addEventListener("click", () => deleteTake(btn.dataset.id));
    });
  }

  function playTake(id){
    const t = takes.find(x => x.id === id);
    if (!t) return;
    previewingTakeId = id;
    recCanvas.style.display = "none";
    takePreview.src = URL.createObjectURL(t.blob);
    takePreview.style.display = "block";
    takePreview.play();
    flipBtn.disabled = true;
    recControls.innerHTML = `<button class="pill btn-cancel" id="backToCamBtn">⬅ Назад к камере</button>`;
    document.getElementById("backToCamBtn").addEventListener("click", () => {
      takePreview.pause();
      takePreview.style.display = "none";
      recCanvas.style.display = "block";
      previewingTakeId = null;
      flipBtn.disabled = false;
      showIdleControls();
    });
    recTimer.textContent = "";
  }

  function deleteTake(id){
    if (!confirm("Удалить этот дубль?")) return;
    takes = takes.filter(t => t.id !== id);
    renderTakesList();
    showIdleControls();
  }

  // --- собрать все дубли в одно видео ---
  function finishAllTakes(){
    if (takes.length === 0) return;
    stopCameraIfActive();
    cancelAnimationFrame(drawLoopId);
    recCanvas.style.display = "none";

    finalBlob = new Blob(takes.map(t => t.blob), { type: "video/webm" });
    finalPoster = takes[0].poster;

    preview.src = URL.createObjectURL(finalBlob);
    preview.poster = finalPoster;
    preview.style.display = "block";
    captionInput.style.display = "block";
    postControls.style.display = "flex";
    recControls.style.display = "none";
    recTimer.textContent = "";
    flipBtn.style.display = "none";
    recBadge.classList.remove("show");
  }

  document.getElementById("cancelBtn").addEventListener("click", () => {
    // "Заново" — сбрасываем всё и начинаем с включения камеры
    finalBlob = null;
    finalPoster = null;
    takes = [];
    renderTakesList();
    preview.style.display = "none";
    preview.src = "";
    captionInput.value = "";
    captionInput.style.display = "none";
    postControls.style.display = "none";
    recControls.style.display = "flex";
    flipBtn.style.display = "block";
    recControls.innerHTML = `<button class="pill btn-start" id="enableCamBtn2">📷 Включить камеру</button>`;
    document.getElementById("enableCamBtn2").addEventListener("click", () => document.getElementById("enableCamBtn")?.click());
    // проще всего — просто перезагрузить страницу
    window.location.reload();
  });

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function countTodayUploads(){
    const snap = await videosRef.orderByChild("author").equalTo(username).get();
    if (!snap.exists()) return 0;
    const now = Date.now();
    let count = 0;
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt < 24*60*60*1000) count++;
    });
    return count;
  }

  async function updateLimitText(){
    const count = await countTodayUploads();
    document.getElementById("limitText").textContent = count >= DAILY_LIMIT
      ? `Сегодня загружено: ${count} / ${DAILY_LIMIT}. При публикации самое старое видео за сутки будет удалено.`
      : `Сегодня загружено: ${count} / ${DAILY_LIMIT}`;
  }
  updateLimitText();

  async function freeUpSpaceIfNeeded(newBytes){
    const snap = await videosRef.get();
    if (!snap.exists()) return;
    let entries = [];
    let totalBytes = newBytes;
    snap.forEach(child => {
      const v = child.val();
      const size = v.videoData ? v.videoData.length : 0;
      totalBytes += size;
      entries.push({ id: child.key, createdAt: v.createdAt, size });
    });
    if (totalBytes <= MAX_TOTAL_BYTES) return;
    entries.sort((a,b) => a.createdAt - b.createdAt);
    for (const e of entries){
      if (totalBytes <= MAX_TOTAL_BYTES) break;
      await videosRef.child(e.id).remove();
      totalBytes -= e.size;
    }
  }

  async function enforceDailyLimit(){
    const snap = await videosRef.orderByChild("author").equalTo(username).get();
    if (!snap.exists()) return;
    const now = Date.now();
    let recent = [];
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt < 24*60*60*1000) recent.push({ id: child.key, createdAt: v.createdAt });
    });
    if (recent.length >= DAILY_LIMIT){
      recent.sort((a,b) => a.createdAt - b.createdAt);
      const toRemove = recent.length - DAILY_LIMIT + 1;
      for (let i = 0; i < toRemove; i++){
        await videosRef.child(recent[i].id).remove();
      }
    }
  }

  document.getElementById("postBtn").addEventListener("click", async () => {
    if (!finalBlob) return;
    const postBtn = document.getElementById("postBtn");
    postBtn.disabled = true;
    postBtn.innerHTML = '<span class="spinner"></span>Публикация...';

    try{
      const base64 = await blobToBase64(finalBlob);
      await enforceDailyLimit();
      await freeUpSpaceIfNeeded(base64.length);
      await videosRef.push({
        author: username,
        videoData: base64,
        poster: finalPoster || null,
        caption: captionInput.value.trim(),
        createdAt: Date.now(),
        likes: {},
        views: {},
        comments: {}
      });
      window.location.href = "feed.html";
    } catch(e){
      alert("Ошибка при публикации: " + e.message + "\n(возможно, видео получилось слишком большим — попробуйте покороче)");
      postBtn.disabled = false;
      postBtn.textContent = "Опубликовать";
    }
  });
</script>
</body>
</html>

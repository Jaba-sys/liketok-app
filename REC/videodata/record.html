<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeTok — Новое видео</title>
<style>
  :root{
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --dark:#161823;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    min-height:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--dark);
    color:#fff;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid #2a2c3a;
  }
  header button{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }
  header .title{ font-weight:700; font-size:16px; }

  .wrap{
    max-width:420px;
    margin:0 auto;
    padding:20px 16px 40px;
    text-align:center;
  }
  .limit-text{ font-size:12px; color:#999; margin:6px 0 14px; }

  video#recPreview{ display:none; }
  #recCanvas, video#preview{
    width:100%;
    max-height:60vh;
    border-radius:14px;
    background:#000;
    display:none;
  }
  .rec-controls{
    display:flex;
    gap:10px;
    margin-top:16px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.pill{
    border:none;
    border-radius:20px;
    padding:12px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
  }
  .btn-start{ background:var(--pink); }
  .btn-pause{ background:#e8a93a; }
  .btn-finish{ background:#1fa774; }
  .btn-post{ background:linear-gradient(90deg,var(--pink),#ff5c7a); }
  .btn-cancel{ background:#333; }
  button.pill:disabled{ opacity:.4; cursor:not-allowed; }
  input#caption{
    width:100%;
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #333;
    background:#1f2130;
    color:#fff;
    font-size:14px;
  }
  .rec-timer{
    font-size:14px;
    color:var(--pink);
    font-weight:700;
    margin-top:10px;
  }
  .spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    vertical-align:middle;
    margin-right:6px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <button id="backBtn">←</button>
  <div class="title">Новое видео</div>
</header>

<div class="wrap">
  <div class="limit-text" id="limitText">Загрузка...</div>
  <video id="recPreview" autoplay muted playsinline></video>
  <canvas id="recCanvas" width="480" height="854"></canvas>
  <video id="preview" controls playsinline></video>
  <div class="rec-timer" id="recTimer"></div>
  <div class="rec-controls" id="recControls">
    <button class="pill btn-start" id="startBtn">🎥 Записать видео</button>
  </div>
  <input type="text" id="caption" placeholder="Подпись к видео..." style="display:none;">
  <div class="rec-controls" id="postControls" style="display:none;">
    <button class="pill btn-post" id="postBtn">Опубликовать</button>
    <button class="pill btn-cancel" id="cancelBtn">Отмена</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const username = sessionStorage.getItem("liketok_user");
  if (!username || !sessionStorage.getItem("liketok_token")){
    window.location.href = "index.html";
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const videosRef = db.ref("videos");

  const DAILY_LIMIT = 12;
  const MAX_TOTAL_BYTES = 15 * 1024 * 1024;
  const MAX_RECORD_MS = 15000;

  document.getElementById("backBtn").addEventListener("click", () => {
    stopEverythingAndLeave();
  });

  function stopEverythingAndLeave(){
    if (mediaRecorder && mediaRecorder.state !== "inactive"){
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    cancelAnimationFrame(drawLoopId);
    clearInterval(recordInterval);
    stopCameraIfActive();
    window.location.href = "feed.html";
  }

  function stopCameraIfActive(){
    if (mediaStream){
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
  }

  let recordedBlob = null;
  let recordedPoster = null;
  let mediaRecorder = null;
  let mediaStream = null;
  let recordInterval = null;
  let elapsedActiveMs = 0;
  let drawLoopId = null;

  const startBtn = document.getElementById("startBtn");
  const recPreview = document.getElementById("recPreview");
  const recCanvas = document.getElementById("recCanvas");
  const canvasCtx = recCanvas.getContext("2d");
  const preview = document.getElementById("preview");
  const recTimer = document.getElementById("recTimer");
  const recControls = document.getElementById("recControls");
  const postControls = document.getElementById("postControls");
  const captionInput = document.getElementById("caption");

  function drawFrame(){
    const vw = recPreview.videoWidth;
    const vh = recPreview.videoHeight;
    if (vw && vh){
      const canvasRatio = recCanvas.width / recCanvas.height;
      const videoRatio = vw / vh;
      let sx, sy, sw, sh;
      if (videoRatio > canvasRatio){
        sh = vh; sw = vh * canvasRatio; sx = (vw - sw) / 2; sy = 0;
      } else {
        sw = vw; sh = vw / canvasRatio; sx = 0; sy = (vh - sh) / 2;
      }
      canvasCtx.save();
      canvasCtx.translate(recCanvas.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(recPreview, sx, sy, sw, sh, 0, 0, recCanvas.width, recCanvas.height);
      canvasCtx.restore();
    }
    drawLoopId = requestAnimationFrame(drawFrame);
  }

  startBtn.addEventListener("click", async () => {
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });
    } catch(e){
      alert("Не удалось получить доступ к камере: " + e.message);
      return;
    }
    recPreview.srcObject = mediaStream;
    recCanvas.style.display = "block";
    preview.style.display = "none";
    await recPreview.play();
    drawFrame();

    const canvasStream = recCanvas.captureStream(30);
    const audioTracks = mediaStream.getAudioTracks();
    const recordStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

    let chunks = [];
    let mimeType = "video/webm;codecs=vp8,opus";
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "video/webm";
    mediaRecorder = new MediaRecorder(recordStream, {
      mimeType,
      videoBitsPerSecond: 700000,
      audioBitsPerSecond: 128000
    });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: "video/webm" });
      recordedPoster = recCanvas.toDataURL("image/jpeg", 0.7);
      recCanvas.style.display = "none";
      cancelAnimationFrame(drawLoopId);
      preview.src = URL.createObjectURL(recordedBlob);
      preview.poster = recordedPoster;
      preview.style.display = "block";
      captionInput.style.display = "block";
      postControls.style.display = "flex";
      recControls.style.display = "none";
      recTimer.textContent = "";
      stopCameraIfActive();
    };
    await new Promise(r => setTimeout(r, 250));
    mediaRecorder.start(500);

    recControls.innerHTML = `<button class="pill btn-pause" id="pauseBtn">⏸ Пауза</button><button class="pill btn-finish" id="finishBtn">⏹ Готово</button>`;
    document.getElementById("pauseBtn").addEventListener("click", pauseRecording);
    document.getElementById("finishBtn").addEventListener("click", stopRecording);

    elapsedActiveMs = 0;
    updateTimerText();
    recordInterval = setInterval(() => {
      if (mediaRecorder && mediaRecorder.state === "recording"){
        elapsedActiveMs += 1000;
        updateTimerText();
        if (elapsedActiveMs >= MAX_RECORD_MS) stopRecording();
      }
    }, 1000);
  });

  function updateTimerText(){
    const secondsLeft = Math.max(0, Math.round((MAX_RECORD_MS - elapsedActiveMs) / 1000));
    recTimer.textContent = `Осталось: ${secondsLeft}s`;
  }

  function pauseRecording(){
    if (mediaRecorder && mediaRecorder.state === "recording"){
      mediaRecorder.pause();
      recControls.innerHTML = `<button class="pill btn-start" id="resumeBtn">▶ Продолжить</button><button class="pill btn-finish" id="finishBtn2">⏹ Готово</button>`;
      document.getElementById("resumeBtn").addEventListener("click", resumeRecording);
      document.getElementById("finishBtn2").addEventListener("click", stopRecording);
    }
  }

  function resumeRecording(){
    if (mediaRecorder && mediaRecorder.state === "paused"){
      mediaRecorder.resume();
      recControls.innerHTML = `<button class="pill btn-pause" id="pauseBtn2">⏸ Пауза</button><button class="pill btn-finish" id="finishBtn3">⏹ Готово</button>`;
      document.getElementById("pauseBtn2").addEventListener("click", pauseRecording);
      document.getElementById("finishBtn3").addEventListener("click", stopRecording);
    }
  }

  function stopRecording(){
    clearInterval(recordInterval);
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  document.getElementById("cancelBtn").addEventListener("click", resetUploadCard);

  function resetUploadCard(){
    stopCameraIfActive();
    recordedBlob = null;
    recordedPoster = null;
    preview.style.display = "none";
    preview.src = "";
    captionInput.value = "";
    captionInput.style.display = "none";
    postControls.style.display = "none";
    recControls.style.display = "flex";
    recControls.innerHTML = `<button class="pill btn-start" id="startBtn2">🎥 Записать видео</button>`;
    document.getElementById("startBtn2").addEventListener("click", () => startBtn.click());
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function countTodayUploads(){
    const snap = await videosRef.orderByChild("author").equalTo(username).get();
    if (!snap.exists()) return 0;
    const now = Date.now();
    let count = 0;
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt < 24*60*60*1000) count++;
    });
    return count;
  }

  async function updateLimitText(){
    const count = await countTodayUploads();
    document.getElementById("limitText").textContent = count >= DAILY_LIMIT
      ? `Сегодня загружено: ${count} / ${DAILY_LIMIT}. При публикации самое старое видео за сутки будет удалено.`
      : `Сегодня загружено: ${count} / ${DAILY_LIMIT}`;
  }
  updateLimitText();

  async function freeUpSpaceIfNeeded(newBytes){
    const snap = await videosRef.get();
    if (!snap.exists()) return;
    let entries = [];
    let totalBytes = newBytes;
    snap.forEach(child => {
      const v = child.val();
      const size = v.videoData ? v.videoData.length : 0;
      totalBytes += size;
      entries.push({ id: child.key, createdAt: v.createdAt, size });
    });
    if (totalBytes <= MAX_TOTAL_BYTES) return;
    entries.sort((a,b) => a.createdAt - b.createdAt);
    for (const e of entries){
      if (totalBytes <= MAX_TOTAL_BYTES) break;
      await videosRef.child(e.id).remove();
      totalBytes -= e.size;
    }
  }

  async function enforceDailyLimit(){
    const snap = await videosRef.orderByChild("author").equalTo(username).get();
    if (!snap.exists()) return;
    const now = Date.now();
    let recent = [];
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt < 24*60*60*1000) recent.push({ id: child.key, createdAt: v.createdAt });
    });
    if (recent.length >= DAILY_LIMIT){
      recent.sort((a,b) => a.createdAt - b.createdAt);
      const toRemove = recent.length - DAILY_LIMIT + 1;
      for (let i = 0; i < toRemove; i++){
        await videosRef.child(recent[i].id).remove();
      }
    }
  }

  document.getElementById("postBtn").addEventListener("click", async () => {
    if (!recordedBlob) return;
    const postBtn = document.getElementById("postBtn");
    postBtn.disabled = true;
    postBtn.innerHTML = '<span class="spinner"></span>Публикация...';

    try{
      const base64 = await blobToBase64(recordedBlob);
      await enforceDailyLimit();
      await freeUpSpaceIfNeeded(base64.length);
      await videosRef.push({
        author: username,
        videoData: base64,
        poster: recordedPoster || null,
        caption: captionInput.value.trim(),
        createdAt: Date.now(),
        likes: {},
        comments: {}
      });
      window.location.href = "feed.html";
    } catch(e){
      alert("Ошибка при публикации: " + e.message + "\n(возможно, видео получилось слишком большим — попробуйте покороче)");
      postBtn.disabled = false;
      postBtn.textContent = "Опубликовать";
    }
  });
</script>
</body>
</html>

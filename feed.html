<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeTok — Лента</title>
<style>
  :root{
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --dark:#161823;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    height:100%;
    height:calc(var(--vh, 1vh) * 100);
    font-family:'Segoe UI', Arial, sans-serif;
    background:#000;
    color:#fff;
    overflow:hidden;
  }

  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  .logo{ font-weight:800; font-size:17px; }
  .logo span:first-child{ color:var(--pink); }
  .logo span:last-child{ color:var(--cyan); }
  .who{ font-size:12px; color:#eee; display:flex; align-items:center; gap:8px; }
  .who button{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:5px 10px;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
  }

  #feed{
    height:100%;
    height:calc(var(--vh, 1vh) * 100);
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
  }
  .video-card{
    position:relative;
    height:100vh;
    height:calc(var(--vh, 1vh) * 100);
    scroll-snap-align:start;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .video-card video{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .card-info{
    position:absolute;
    left:12px;
    right:74px;
    bottom:130px;
    z-index:5;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .card-info .author{ font-weight:700; font-size:15px; }
  .card-info .caption{ font-size:13px; margin-top:4px; opacity:.95; word-break:break-word; }
  .card-info .time{ font-size:11px; margin-top:4px; opacity:.7; }

  .side-actions{
    position:absolute;
    right:8px;
    bottom:140px;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .side-btn{
    background:none;
    border:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    font-size:11px;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .side-btn .icon{ font-size:26px; line-height:1; }
  .side-btn.liked .icon{ color:var(--pink); }

  .options-btn{
    position:absolute;
    top:64px;
    right:10px;
    z-index:6;
    background:rgba(0,0,0,.4);
    border:none;
    color:#fff;
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    line-height:1;
  }
  .options-menu{
    position:absolute;
    top:102px;
    right:10px;
    z-index:6;
    background:#26283a;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:none;
  }
  .options-menu.show{ display:block; }
  .options-menu button{
    display:block;
    width:100%;
    padding:10px 16px;
    background:none;
    border:none;
    color:#ff8a8a;
    font-size:13px;
    text-align:left;
    cursor:pointer;
    white-space:nowrap;
  }
  .options-menu button:hover{ background:rgba(255,255,255,.06); }

  @media (max-width: 480px){
    .card-info{ left:10px; right:64px; bottom:150px; }
    .card-info .author{ font-size:14px; }
    .card-info .caption{ font-size:12px; }
    .side-actions{ right:6px; bottom:160px; gap:16px; }
    .side-btn .icon{ font-size:24px; }
    .side-btn{ font-size:10px; }
  }

  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:20;
    display:flex;
    justify-content:center;
    padding:14px 0 18px;
    background:linear-gradient(0deg, rgba(0,0,0,.6), transparent);
  }
  .add-btn{
    width:56px;
    height:40px;
    border-radius:10px;
    border:none;
    background:linear-gradient(90deg, var(--cyan), var(--pink));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    text-decoration:none;
  }

  .empty{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:14px;
    text-align:center;
    padding:0 30px;
  }
  .spinner{
    width:34px;
    height:34px;
    border:3px solid #333;
    border-top-color:var(--pink);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .banned-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
  }

  .comments-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:40;
    background:#1f2130;
    border-radius:18px 18px 0 0;
    max-height:60vh;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .comments-sheet.show{ transform:translateY(0); }
  .comments-header{
    padding:14px 16px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #2a2c3a;
    font-size:14px;
    font-weight:700;
  }
  .comments-header button{
    background:none; border:none; color:#aaa; font-size:20px; cursor:pointer;
  }
  .comments-list{ overflow-y:auto; padding:10px 16px; flex:1; }
  .comment{ font-size:13px; padding:8px 0; border-bottom:1px solid #262838; }
  .comment b{ color:var(--cyan); }
  .comment-input-row{ display:flex; gap:8px; padding:10px 16px 16px; }
  .comment-input-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #333;
    background:#14151f;
    color:#fff;
    font-size:13px;
  }
  .comment-input-row button{
    background:var(--pink);
    border:none;
    color:#fff;
    padding:0 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>Like</span><span>Tok</span></div>
  <div class="who">
    <span id="whoami"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
</header>

<div id="feed">
  <div class="empty" id="initialLoader">
    <div class="spinner"></div>
    <div style="margin-top:10px;">Загрузка ленты...</div>
  </div>
</div>

<div class="bottom-bar">
  <a class="add-btn" href="record.html">+</a>
</div>

<div class="comments-sheet" id="commentsSheet">
  <div class="comments-header">
    <span>Комментарии</span>
    <button id="closeCommentsBtn">✕</button>
  </div>
  <div class="comments-list" id="commentsList"></div>
  <div class="comment-input-row">
    <input type="text" id="commentInput" placeholder="Написать комментарий...">
    <button id="sendCommentBtn">→</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const username = sessionStorage.getItem("liketok_user");
  if (!username || !sessionStorage.getItem("liketok_token")){
    window.location.href = "index.html";
  }

  function setRealVh(){
    document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
  }
  setRealVh();
  window.addEventListener("resize", setRealVh);
  window.addEventListener("orientationchange", setRealVh);

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const usersRef = db.ref("users");
  const videosRef = db.ref("videos");

  const VIDEO_LIFETIME_MS = 24 * 60 * 60 * 1000;

  document.getElementById("whoami").textContent = "@" + username;
  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.clear();
    window.location.href = "index.html";
  });

  let currentVideos = {};
  let activeCommentVideoId = null;
  let isBanned = false;

  usersRef.child(username).on("value", (snap) => {
    if (!snap.exists()) { window.location.href = "index.html"; return; }
    const u = snap.val();
    const now = Date.now();
    const banned = u.banned && (u.banUntil === null || u.banUntil > now);
    if (banned && !isBanned){
      isBanned = true;
      const until = u.banUntil ? new Date(u.banUntil).toLocaleString("ru-RU") : "навсегда";
      document.body.innerHTML = `
        <div class="banned-screen">
          <h2>🚫 Аккаунт заблокирован</h2>
          <p>До: ${until}</p>
        </div>`;
    }
  });

  function timeAgo(ts){
    const diffMin = Math.floor((Date.now() - ts) / 60000);
    if (diffMin < 1) return "только что";
    if (diffMin < 60) return diffMin + " мин назад";
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + " ч назад";
    return Math.floor(diffH/24) + " дн назад";
  }

  async function cleanupOldVideos(){
    const snap = await videosRef.get();
    if (!snap.exists()) return;
    const now = Date.now();
    const toDelete = [];
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt > VIDEO_LIFETIME_MS) toDelete.push(child.key);
    });
    for (const id of toDelete){
      await videosRef.child(id).remove();
    }
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderFeed(){
    if (isBanned) return;
    const feedEl = document.getElementById("feed");
    if (!feedEl) return;
    const savedScroll = feedEl.scrollTop;
    const list = Object.entries(currentVideos)
      .map(([id, v]) => ({ id, ...v }))
      .sort((a,b) => a.createdAt - b.createdAt); // старые сверху, новые снизу

    if (list.length === 0){
      feedEl.innerHTML = '<div class="empty">Пока нет видео.<br>Нажмите «+» внизу, чтобы снять первое! 🎬</div>';
      return;
    }

    feedEl.innerHTML = list.map(v => {
      const likes = v.likes || {};
      const likeCount = Object.keys(likes).length;
      const liked = !!likes[username];
      const commentCount = v.comments ? Object.keys(v.comments).length : 0;
      const isOwn = v.author === username;
      return `
        <div class="video-card" data-id="${v.id}">
          <video src="${v.videoData}" ${v.poster ? `poster="${v.poster}"` : ""} playsinline loop muted preload="auto"></video>
          ${isOwn ? `
            <button class="options-btn" data-action="toggleMenu" data-id="${v.id}">⋮</button>
            <div class="options-menu" id="menu-${v.id}">
              <button data-action="deleteOwn" data-id="${v.id}">🗑 Удалить видео</button>
            </div>
          ` : ""}
          <div class="card-info">
            <div class="author">@${v.author}</div>
            ${v.caption ? `<div class="caption">${escapeHtml(v.caption)}</div>` : ""}
            <div class="time">${timeAgo(v.createdAt)}</div>
          </div>
          <div class="side-actions">
            <button class="side-btn ${liked ? "liked" : ""}" data-action="like" data-id="${v.id}">
              <span class="icon">${liked ? "❤️" : "🤍"}</span>
              <span>${likeCount}</span>
            </button>
            <button class="side-btn" data-action="comments" data-id="${v.id}">
              <span class="icon">💬</span>
              <span>${commentCount}</span>
            </button>
          </div>
        </div>
      `;
    }).join("");

    feedEl.scrollTop = savedScroll;

    // клик по видео = включить/выключить звук (видео при этом продолжает играть)
    feedEl.querySelectorAll(".video-card video").forEach(v => {
      v.addEventListener("click", () => {
        if (v.muted){
          v.muted = false;
          if (v.paused) v.play().catch(()=>{});
        } else {
          v.muted = true;
        }
      });
      if (!v.getAttribute("poster")){
        v.addEventListener("loadedmetadata", () => {
          v.currentTime = 0.05;
        }, { once: true });
      }
    });

    feedEl.querySelectorAll("[data-action='like']").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const likeRef = videosRef.child(id).child("likes").child(username);
        const snap = await likeRef.get();
        if (snap.exists()) await likeRef.remove();
        else await likeRef.set(true);
      });
    });

    feedEl.querySelectorAll("[data-action='comments']").forEach(btn => {
      btn.addEventListener("click", () => openComments(btn.dataset.id));
    });

    feedEl.querySelectorAll("[data-action='toggleMenu']").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const menu = document.getElementById("menu-" + btn.dataset.id);
        const wasOpen = menu.classList.contains("show");
        document.querySelectorAll(".options-menu.show").forEach(m => m.classList.remove("show"));
        if (!wasOpen) menu.classList.add("show");
      });
    });

    feedEl.querySelectorAll("[data-action='deleteOwn']").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm("Удалить это видео насовсем?")) return;
        await videosRef.child(btn.dataset.id).remove();
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const vid = entry.target.querySelector("video");
        if (!vid) return;
        if (entry.isIntersecting) vid.play().catch(()=>{});
        else vid.pause();
      });
    }, { threshold: 0.6 });
    feedEl.querySelectorAll(".video-card").forEach(card => observer.observe(card));
  }

  const commentsSheet = document.getElementById("commentsSheet");
  const commentsList = document.getElementById("commentsList");

  function openComments(videoId){
    activeCommentVideoId = videoId;
    renderComments();
    commentsSheet.classList.add("show");
  }
  document.getElementById("closeCommentsBtn").addEventListener("click", () => {
    commentsSheet.classList.remove("show");
    activeCommentVideoId = null;
  });

  function renderComments(){
    if (!activeCommentVideoId) return;
    const v = currentVideos[activeCommentVideoId];
    if (!v) { commentsList.innerHTML = ""; return; }
    const comments = v.comments ? Object.values(v.comments) : [];
    comments.sort((a,b) => a.createdAt - b.createdAt);
    commentsList.innerHTML = comments.length
      ? comments.map(c => `<div class="comment"><b>@${c.author}:</b> ${escapeHtml(c.text)}</div>`).join("")
      : '<div class="comment" style="color:#666;">Комментариев пока нет</div>';
  }

  document.getElementById("sendCommentBtn").addEventListener("click", sendComment);
  document.getElementById("commentInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendComment();
  });
  async function sendComment(){
    if (!activeCommentVideoId) return;
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text) return;
    await videosRef.child(activeCommentVideoId).child("comments").push({
      author: username,
      text,
      createdAt: Date.now()
    });
    input.value = "";
  }

  document.addEventListener("click", () => {
    document.querySelectorAll(".options-menu.show").forEach(m => m.classList.remove("show"));
  });

  (async function init(){
    await cleanupOldVideos();
    videosRef.on("value", (snap) => {
      currentVideos = snap.val() || {};
      renderFeed();
      if (activeCommentVideoId) renderComments();
    });
  })();
</script>
</body>
</html>

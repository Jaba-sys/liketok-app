<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LikeTok — Лента</title>
<style>
  :root{
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --dark:#161823;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    height:100%;
    height:calc(var(--vh, 1vh) * 100);
    font-family:'Segoe UI', Arial, sans-serif;
    background:#000;
    color:#fff;
    overflow:hidden;
  }

  /* --- шапка поверх ленты --- */
  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  .logo{ font-weight:800; font-size:17px; }
  .logo span:first-child{ color:var(--pink); }
  .logo span:last-child{ color:var(--cyan); }
  .who{ font-size:12px; color:#eee; display:flex; align-items:center; gap:8px; }
  .who button{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:5px 10px;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
  }

  /* --- лента: вертикальный скролл-снап на весь экран --- */
  #feed{
    height:100%;
    height:calc(var(--vh, 1vh) * 100);
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
  }
  .video-card{
    position:relative;
    height:100vh;
    height:calc(var(--vh, 1vh) * 100);
    scroll-snap-align:start;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .video-card video{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* --- инфо снизу слева --- */
  .card-info{
    position:absolute;
    left:12px;
    right:74px;
    bottom:130px;
    z-index:5;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .card-info .author{ font-weight:700; font-size:15px; }
  .card-info .caption{ font-size:13px; margin-top:4px; opacity:.95; word-break:break-word; }
  .card-info .time{ font-size:11px; margin-top:4px; opacity:.7; }

  /* --- правая колонка действий (как в TikTok) --- */
  .side-actions{
    position:absolute;
    right:8px;
    bottom:140px;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .side-btn{
    background:none;
    border:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    font-size:11px;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .side-btn .icon{
    font-size:26px;
    line-height:1;
  }
  .side-btn.liked .icon{ color:var(--pink); }

  /* --- мобильные телефоны: чуть уже колонка текста, чуть выше действия --- */
  @media (max-width: 480px){
    .card-info{
      left:10px;
      right:64px;
      bottom:150px;
    }
    .card-info .author{ font-size:14px; }
    .card-info .caption{ font-size:12px; }
    .side-actions{
      right:6px;
      bottom:160px;
      gap:16px;
    }
    .side-btn .icon{ font-size:24px; }
    .side-btn{ font-size:10px; }
  }

  /* --- нижняя панель с плюсиком --- */
  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:20;
    display:flex;
    justify-content:center;
    padding:14px 0 18px;
    background:linear-gradient(0deg, rgba(0,0,0,.6), transparent);
  }
  .add-btn{
    width:56px;
    height:40px;
    border-radius:10px;
    border:none;
    background:linear-gradient(90deg, var(--cyan), var(--pink));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }

  .empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:14px;
    text-align:center;
    padding:0 30px;
  }
  .banned-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
  }

  /* --- модалка записи видео --- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .modal-overlay.show{ display:flex; }
  .record-modal{
    background:#1f2130;
    border-radius:18px;
    padding:18px;
    width:100%;
    max-width:380px;
    text-align:center;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:10px; right:14px;
    background:none;
    border:none;
    color:#aaa;
    font-size:20px;
    cursor:pointer;
  }
  .limit-text{ font-size:12px; color:#999; margin:6px 0 12px; }
  video#recPreview, video#preview{
    width:100%;
    max-height:420px;
    border-radius:12px;
    background:#000;
    display:none;
  }
  .rec-controls{
    display:flex;
    gap:10px;
    margin-top:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.pill{
    border:none;
    border-radius:20px;
    padding:10px 18px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
  }
  .btn-start{ background:var(--pink); }
  .btn-stop{ background:#555; }
  .btn-post{ background:linear-gradient(90deg,var(--pink),#ff5c7a); }
  .btn-cancel{ background:#333; }
  button.pill:disabled{ opacity:.4; cursor:not-allowed; }
  input#caption{
    width:100%;
    margin-top:10px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #333;
    background:#14151f;
    color:#fff;
    font-size:14px;
  }
  .rec-timer{
    font-size:13px;
    color:var(--pink);
    font-weight:700;
    margin-top:6px;
  }

  /* --- шторка комментариев --- */
  .comments-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:40;
    background:#1f2130;
    border-radius:18px 18px 0 0;
    max-height:60vh;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .comments-sheet.show{ transform:translateY(0); }
  .comments-header{
    padding:14px 16px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #2a2c3a;
    font-size:14px;
    font-weight:700;
  }
  .comments-header button{
    background:none; border:none; color:#aaa; font-size:20px; cursor:pointer;
  }
  .comments-list{
    overflow-y:auto;
    padding:10px 16px;
    flex:1;
  }
  .comment{
    font-size:13px;
    padding:8px 0;
    border-bottom:1px solid #262838;
  }
  .comment b{ color:var(--cyan); }
  .comment-input-row{
    display:flex;
    gap:8px;
    padding:10px 16px 16px;
  }
  .comment-input-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #333;
    background:#14151f;
    color:#fff;
    font-size:13px;
  }
  .comment-input-row button{
    background:var(--pink);
    border:none;
    color:#fff;
    padding:0 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>Like</span><span>Tok</span></div>
  <div class="who">
    <span id="whoami"></span>
    <button id="logoutBtn">Выйти</button>
  </div>
</header>

<div id="feed"></div>

<div class="bottom-bar">
  <button class="add-btn" id="openRecordBtn">+</button>
</div>

<!-- модалка записи -->
<div class="modal-overlay" id="recordModal">
  <div class="record-modal">
    <button class="modal-close" id="closeModalBtn">✕</button>
    <div class="limit-text" id="limitText">Загрузка...</div>
    <video id="recPreview" autoplay muted playsinline></video>
    <video id="preview" controls playsinline></video>
    <div class="rec-timer" id="recTimer"></div>
    <div class="rec-controls" id="recControls">
      <button class="pill btn-start" id="startBtn">🎥 Записать видео</button>
    </div>
    <input type="text" id="caption" placeholder="Подпись к видео..." style="display:none;">
    <div class="rec-controls" id="postControls" style="display:none;">
      <button class="pill btn-post" id="postBtn">Опубликовать</button>
      <button class="pill btn-cancel" id="cancelBtn">Отмена</button>
    </div>
  </div>
</div>

<!-- шторка комментариев -->
<div class="comments-sheet" id="commentsSheet">
  <div class="comments-header">
    <span>Комментарии</span>
    <button id="closeCommentsBtn">✕</button>
  </div>
  <div class="comments-list" id="commentsList"></div>
  <div class="comment-input-row">
    <input type="text" id="commentInput" placeholder="Написать комментарий...">
    <button id="sendCommentBtn">→</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const username = sessionStorage.getItem("liketok_user");
  if (!username || !sessionStorage.getItem("liketok_token")){
    window.location.href = "index.html";
  }

  // фикс мобильных браузеров: 100vh не учитывает адресную строку,
  // из-за этого низ экрана (лайки, ник, описание) может уезжать за видимую область
  function setRealVh(){
    document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
  }
  setRealVh();
  window.addEventListener("resize", setRealVh);
  window.addEventListener("orientationchange", setRealVh);

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const usersRef = db.ref("users");
  const videosRef = db.ref("videos");

  const DAILY_LIMIT = 8;
  const MAX_TOTAL_BYTES = 15 * 1024 * 1024;
  const MAX_RECORD_MS = 15000;
  const VIDEO_LIFETIME_MS = 24 * 60 * 60 * 1000;

  document.getElementById("whoami").textContent = "@" + username;
  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.clear();
    window.location.href = "index.html";
  });

  let currentVideos = {};
  let recordedBlob = null;
  let mediaRecorder = null;
  let mediaStream = null;
  let recordTimeout = null;
  let recordInterval = null;
  let activeCommentVideoId = null;
  let isBanned = false;

  // --- ЖИВАЯ проверка бана: реагирует мгновенно, без перезагрузки страницы ---
  usersRef.child(username).on("value", (snap) => {
    if (!snap.exists()) { window.location.href = "index.html"; return; }
    const u = snap.val();
    const now = Date.now();
    const banned = u.banned && (u.banUntil === null || u.banUntil > now);
    if (banned && !isBanned){
      isBanned = true;
      const until = u.banUntil ? new Date(u.banUntil).toLocaleString("ru-RU") : "навсегда";
      document.body.innerHTML = `
        <div class="banned-screen">
          <h2>🚫 Аккаунт заблокирован</h2>
          <p>До: ${until}</p>
        </div>`;
    }
  });

  // --- модалка записи ---
  const recordModal = document.getElementById("recordModal");
  document.getElementById("openRecordBtn").addEventListener("click", () => {
    recordModal.classList.add("show");
    updateLimitText();
  });
  document.getElementById("closeModalBtn").addEventListener("click", () => {
    stopCameraIfActive();
    recordModal.classList.remove("show");
  });

  function stopCameraIfActive(){
    if (mediaStream){
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
  }

  const startBtn = document.getElementById("startBtn");
  const recPreview = document.getElementById("recPreview");
  const preview = document.getElementById("preview");
  const recTimer = document.getElementById("recTimer");
  const recControls = document.getElementById("recControls");
  const postControls = document.getElementById("postControls");
  const captionInput = document.getElementById("caption");

  startBtn.addEventListener("click", async () => {
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { width: 480, height: 854, facingMode: "user" },
        audio: true
      });
    } catch(e){
      alert("Не удалось получить доступ к камере: " + e.message);
      return;
    }
    recPreview.srcObject = mediaStream;
    recPreview.style.display = "block";
    preview.style.display = "none";

    let chunks = [];
    let mimeType = "video/webm;codecs=vp8,opus";
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "video/webm";
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType, videoBitsPerSecond: 700000 });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: "video/webm" });
      recPreview.style.display = "none";
      preview.src = URL.createObjectURL(recordedBlob);
      preview.style.display = "block";
      captionInput.style.display = "block";
      postControls.style.display = "flex";
      recControls.style.display = "none";
      recTimer.textContent = "";
      stopCameraIfActive();
    };
    mediaRecorder.start();

    recControls.innerHTML = `<button class="pill btn-stop" id="stopBtn">⏹ Остановить</button>`;
    document.getElementById("stopBtn").addEventListener("click", stopRecording);

    let secondsLeft = MAX_RECORD_MS / 1000;
    recTimer.textContent = `Запись: ${secondsLeft}s`;
    recordInterval = setInterval(() => {
      secondsLeft--;
      recTimer.textContent = `Запись: ${secondsLeft}s`;
      if (secondsLeft <= 0) clearInterval(recordInterval);
    }, 1000);
    recordTimeout = setTimeout(stopRecording, MAX_RECORD_MS);
  });

  function stopRecording(){
    clearTimeout(recordTimeout);
    clearInterval(recordInterval);
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  document.getElementById("cancelBtn").addEventListener("click", resetUploadCard);

  function resetUploadCard(){
    stopCameraIfActive();
    recordedBlob = null;
    preview.style.display = "none";
    preview.src = "";
    captionInput.value = "";
    captionInput.style.display = "none";
    postControls.style.display = "none";
    recControls.style.display = "flex";
    recControls.innerHTML = `<button class="pill btn-start" id="startBtn2">🎥 Записать видео</button>`;
    document.getElementById("startBtn2").addEventListener("click", () => startBtn.click());
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function countTodayUploads(){
    const snap = await videosRef.orderByChild("author").equalTo(username).get();
    if (!snap.exists()) return 0;
    const now = Date.now();
    let count = 0;
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt < 24*60*60*1000) count++;
    });
    return count;
  }

  async function updateLimitText(){
    const count = await countTodayUploads();
    const left = Math.max(0, DAILY_LIMIT - count);
    document.getElementById("limitText").textContent =
      `Сегодня загружено: ${count} / ${DAILY_LIMIT}. Осталось: ${left}`;
    startBtn.disabled = left <= 0;
  }

  async function freeUpSpaceIfNeeded(newBytes){
    const snap = await videosRef.get();
    if (!snap.exists()) return;
    let entries = [];
    let totalBytes = newBytes;
    snap.forEach(child => {
      const v = child.val();
      const size = v.videoData ? v.videoData.length : 0;
      totalBytes += size;
      entries.push({ id: child.key, createdAt: v.createdAt, size });
    });
    if (totalBytes <= MAX_TOTAL_BYTES) return;
    entries.sort((a,b) => a.createdAt - b.createdAt);
    for (const e of entries){
      if (totalBytes <= MAX_TOTAL_BYTES) break;
      await videosRef.child(e.id).remove();
      totalBytes -= e.size;
    }
  }

  document.getElementById("postBtn").addEventListener("click", async () => {
    if (!recordedBlob) return;
    const count = await countTodayUploads();
    if (count >= DAILY_LIMIT){
      alert("Дневной лимит видео исчерпан (" + DAILY_LIMIT + " в день)");
      return;
    }
    const postBtn = document.getElementById("postBtn");
    postBtn.disabled = true;
    postBtn.textContent = "Публикация...";

    try{
      const base64 = await blobToBase64(recordedBlob);
      await freeUpSpaceIfNeeded(base64.length);
      await videosRef.push({
        author: username,
        videoData: base64,
        caption: captionInput.value.trim(),
        createdAt: Date.now(),
        likes: {},
        comments: {}
      });
      resetUploadCard();
      updateLimitText();
      recordModal.classList.remove("show");
    } catch(e){
      alert("Ошибка при публикации: " + e.message + "\n(возможно, видео получилось слишком большим — попробуйте покороче)");
    } finally {
      postBtn.disabled = false;
      postBtn.textContent = "Опубликовать";
    }
  });

  // --- лента ---
  function timeAgo(ts){
    const diffMin = Math.floor((Date.now() - ts) / 60000);
    if (diffMin < 1) return "только что";
    if (diffMin < 60) return diffMin + " мин назад";
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + " ч назад";
    return Math.floor(diffH/24) + " дн назад";
  }

  async function cleanupOldVideos(){
    const snap = await videosRef.get();
    if (!snap.exists()) return;
    const now = Date.now();
    const toDelete = [];
    snap.forEach(child => {
      const v = child.val();
      if (now - v.createdAt > VIDEO_LIFETIME_MS) toDelete.push(child.key);
    });
    for (const id of toDelete){
      await videosRef.child(id).remove();
    }
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderFeed(){
    if (isBanned) return;
    const feedEl = document.getElementById("feed");
    if (!feedEl) return;
    const list = Object.entries(currentVideos)
      .map(([id, v]) => ({ id, ...v }))
      .sort((a,b) => b.createdAt - a.createdAt);

    if (list.length === 0){
      feedEl.innerHTML = '<div class="empty">Пока нет видео.<br>Нажмите «+» внизу, чтобы снять первое! 🎬</div>';
      return;
    }

    feedEl.innerHTML = list.map(v => {
      const likes = v.likes || {};
      const likeCount = Object.keys(likes).length;
      const liked = !!likes[username];
      const commentCount = v.comments ? Object.keys(v.comments).length : 0;
      return `
        <div class="video-card" data-id="${v.id}">
          <video src="${v.videoData}" playsinline loop muted></video>
          <div class="card-info">
            <div class="author">@${v.author}</div>
            ${v.caption ? `<div class="caption">${escapeHtml(v.caption)}</div>` : ""}
            <div class="time">${timeAgo(v.createdAt)}</div>
          </div>
          <div class="side-actions">
            <button class="side-btn ${liked ? "liked" : ""}" data-action="like" data-id="${v.id}">
              <span class="icon">${liked ? "❤️" : "🤍"}</span>
              <span>${likeCount}</span>
            </button>
            <button class="side-btn" data-action="comments" data-id="${v.id}">
              <span class="icon">💬</span>
              <span>${commentCount}</span>
            </button>
          </div>
        </div>
      `;
    }).join("");

    // клик по видео = play/pause, звук включается по тапу (автоплей с звуком браузеры блокируют)
    feedEl.querySelectorAll(".video-card video").forEach(v => {
      v.addEventListener("click", () => {
        v.muted = false;
        if (v.paused) v.play(); else v.pause();
      });
    });

    feedEl.querySelectorAll("[data-action='like']").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const likeRef = videosRef.child(id).child("likes").child(username);
        const snap = await likeRef.get();
        if (snap.exists()) await likeRef.remove();
        else await likeRef.set(true);
      });
    });

    feedEl.querySelectorAll("[data-action='comments']").forEach(btn => {
      btn.addEventListener("click", () => openComments(btn.dataset.id));
    });

    // автовоспроизведение видео, которое сейчас в кадре
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const vid = entry.target.querySelector("video");
        if (!vid) return;
        if (entry.isIntersecting) vid.play().catch(()=>{});
        else vid.pause();
      });
    }, { threshold: 0.6 });
    feedEl.querySelectorAll(".video-card").forEach(card => observer.observe(card));
  }

  // --- шторка комментариев ---
  const commentsSheet = document.getElementById("commentsSheet");
  const commentsList = document.getElementById("commentsList");

  function openComments(videoId){
    activeCommentVideoId = videoId;
    renderComments();
    commentsSheet.classList.add("show");
  }
  document.getElementById("closeCommentsBtn").addEventListener("click", () => {
    commentsSheet.classList.remove("show");
    activeCommentVideoId = null;
  });

  function renderComments(){
    if (!activeCommentVideoId) return;
    const v = currentVideos[activeCommentVideoId];
    if (!v) { commentsList.innerHTML = ""; return; }
    const comments = v.comments ? Object.values(v.comments) : [];
    comments.sort((a,b) => a.createdAt - b.createdAt);
    commentsList.innerHTML = comments.length
      ? comments.map(c => `<div class="comment"><b>@${c.author}:</b> ${escapeHtml(c.text)}</div>`).join("")
      : '<div class="comment" style="color:#666;">Комментариев пока нет</div>';
  }

  document.getElementById("sendCommentBtn").addEventListener("click", sendComment);
  document.getElementById("commentInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendComment();
  });
  async function sendComment(){
    if (!activeCommentVideoId) return;
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text) return;
    await videosRef.child(activeCommentVideoId).child("comments").push({
      author: username,
      text,
      createdAt: Date.now()
    });
    input.value = "";
  }

  (async function init(){
    await cleanupOldVideos();

    videosRef.on("value", (snap) => {
      currentVideos = snap.val() || {};
      renderFeed();
      if (activeCommentVideoId) renderComments();
    });
  })();
</script>
</body>
</html>
